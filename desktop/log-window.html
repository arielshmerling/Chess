<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <script src="/strings/en.js"></script>
  <script src="/strings/en-extra.js"></script>
  <script src="/strings/he.js"></script>
  <script src="/strings/he-extra.js"></script>
  <script src="/strings/ja.js"></script>
  <script src="/strings/ja-extra.js"></script>
  <script src="/strings/fr.js"></script>
  <script src="/strings/fr-extra.js"></script>
  <script src="/strings/de.js"></script>
  <script src="/strings/de-extra.js"></script>
  <script src="/strings/zh.js"></script>
  <script src="/strings/zh-extra.js"></script>
  <script src="/strings/ar.js"></script>
  <script src="/strings/ar-extra.js"></script>
  <script src="/strings/hi.js"></script>
  <script src="/strings/hi-extra.js"></script>
  <script src="/strings/es.js"></script>
  <script src="/strings/es-extra.js"></script>
  <script src="/strings/index.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Server Log — Shmerling Chess</title>
  <style>
    :root {
      --bg: #1a1b1e;
      --fg: #d8d5ce;
      --muted: #8a8680;
      --info: #d8d5ce;
      --warn: #d4a017;
      --error: #e07070;
      --debug: #7a9eb5;
      --toolbar: #24262b;
      --border: #33363c;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.45;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: var(--toolbar);
      border-bottom: 1px solid var(--border);
      flex: 0 0 auto;
    }

    .toolbar h1 {
      margin: 0;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.02em;
      flex: 1;
    }

    .toolbar button {
      appearance: none;
      border: 1px solid var(--border);
      background: #2c2f36;
      color: var(--fg);
      padding: 4px 10px;
      font: inherit;
      cursor: pointer;
    }

    .toolbar button:hover {
      background: #383c45;
    }

    #log {
      flex: 1;
      overflow: auto;
      padding: 10px 12px 16px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .line {
      margin: 0 0 2px;
    }

    .time {
      color: var(--muted);
      margin-right: 8px;
    }

    .level {
      display: inline-block;
      min-width: 4.5em;
      margin-right: 8px;
      text-transform: uppercase;
      font-size: 11px;
    }

    .level-info { color: var(--info); }
    .level-warn { color: var(--warn); }
    .level-error { color: var(--error); }
    .level-debug { color: var(--debug); }

    .empty {
      color: var(--muted);
      padding: 24px 12px;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <h1>Server log</h1>
    <button type="button" id="btnClear" title="Clear the view (does not erase history)">Clear view</button>
    <button type="button" id="btnBottom" title="Jump to latest">Latest</button>
  </div>
  <div id="log" aria-live="polite"></div>
  <script>
    (function () {
      const logEl = document.getElementById("log");
      const btnClear = document.getElementById("btnClear");
      const btnBottom = document.getElementById("btnBottom");
      let stickToBottom = true;

      function formatTime(iso) {
        try {
          const d = new Date(iso);
          return d.toLocaleTimeString(undefined, { hour12: false }) +
            "." + String(d.getMilliseconds()).padStart(3, "0");
        } catch {
          return iso;
        }
      }

      function appendEntry(entry) {
        const empty = logEl.querySelector(".empty");
        if (empty) {
          empty.remove();
        }
        const row = document.createElement("div");
        row.className = "line";
        const level = entry.level || "info";
        row.innerHTML =
          '<span class="time">' + escapeHtml(formatTime(entry.t)) + "</span>" +
          '<span class="level level-' + escapeHtml(level) + '">' + escapeHtml(level) + "</span>" +
          '<span class="msg">' + escapeHtml(entry.message || "") + "</span>";
        logEl.appendChild(row);
        if (stickToBottom) {
          logEl.scrollTop = logEl.scrollHeight;
        }
      }

      function escapeHtml(text) {
        return String(text)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function showEmpty() {
        logEl.innerHTML = '<div class="empty">Waiting for server log output…</div>';
      }

      logEl.addEventListener("scroll", function () {
        const distance = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight;
        stickToBottom = distance < 40;
      });

      btnClear.addEventListener("click", function () {
        showEmpty();
      });

      btnBottom.addEventListener("click", function () {
        stickToBottom = true;
        logEl.scrollTop = logEl.scrollHeight;
      });

      showEmpty();

      window.serverLog.getHistory().then(function (entries) {
        if (!entries || !entries.length) {
          return;
        }
        logEl.innerHTML = "";
        entries.forEach(appendEntry);
        stickToBottom = true;
        logEl.scrollTop = logEl.scrollHeight;
      });

      window.serverLog.onAppend(appendEntry);
    })();
  </script>
<script>
(function () {
  var t = window.ShmerlingStrings && window.ShmerlingStrings.t;
  if (!t) return;
  document.title = t("site.log.title");
  var clearBtn = document.getElementById("clearBtn");
  if (clearBtn) clearBtn.textContent = t("site.log.clear");
  var latestBtn = document.getElementById("latestBtn");
  if (latestBtn) latestBtn.textContent = t("site.log.latest");
  var empty = document.getElementById("emptyState");
  if (empty) empty.textContent = t("site.log.waiting");
})();
</script></body>
</html>
