<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="/">
  <title>Shmerling Chess</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/app/ui/app.css">
  <link rel="stylesheet" href="/app/ui/desktop-play.css">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <script src="/ChessGame.js"></script>
  <script src="/themes.js"></script>
  <script src="/pieceSets.js"></script>
  <script src="/app/ui/play-shell-detect.js"></script>
  <script src="/app/ui/desktop-theme-keys.js"></script>
  <script src="/app/ui/desktop-custom-theme.js"></script>
  <script src="/app/ui/desktop-theme.js"></script>
  <script src="/app/ui/desktop-chrome.js"></script>
  <script src="/app/ui/desktop-api.js"></script>
  <script src="/app/ui/desktop-game-settings.js"></script>
  <script src="/app/ui/desktop-prefs-gameplay.js"></script>
  <script src="/app/ui/desktop-fullscreen.js"></script>
  <script src="/app/ui/desktop-prefs-display.js"></script>
  <script src="/app/ui/desktop-engine.js"></script>
  <script src="/app/ui/desktop-game-log.js"></script>
  <script src="/app/ui/desktop-dialog.js"></script>
  <script src="/app/ui/desktop-context-menu.js"></script>
  <script src="/app/ui/desktop-start-menu.js"></script>
  <script src="/app/ui/desktop-board.js"></script>
  <script src="/app/ui/desktop-board-scale.js"></script>
  <script src="/app/ui/desktop-dock-panels.js"></script>
  <script src="/app/ui/desktop-position-setup.js"></script>
  <script src="/app/ui/desktop-brain-config.js"></script>
  <script src="/app/ui/desktop-game-run.js"></script>
  <script src="/app/ui/desktop-position-validation.js"></script>
  <script src="/app/ui/desktop-play-resume.js"></script>
  <script src="/app/ui/desktop-play.js"></script>
</head>
<body class="desktop-shell desktop-play-page desktop-has-topbar">
  <div class="desktop-play-shell">
    <nav id="desktopPlayActions" class="desktop-play-actions" aria-label="Game actions"></nav>

    <div class="desktop-play-workspace">
      <header class="desktop-play-header" id="desktopPlayHeader" aria-label="Players and clocks">
        <p id="desktopPlayMatchTitle" class="desktop-play-header-match">Play Mode</p>

        <div class="desktop-play-header-center">
          <div
            id="desktopPlayHeaderBlack"
            class="desktop-play-header-clock desktop-play-header-clock--black"
            aria-label="Black player clock"
          >
            <span class="desktop-play-color-tag desktop-play-color-tag--black" aria-hidden="true">Black</span>
            <span id="desktopPlayBlackName" class="desktop-play-header-player">Black</span>
            <span id="blackClockTimeText" class="desktop-play-header-time">00:00:00</span>
          </div>

          <div
            id="desktopPlayHeaderWhite"
            class="desktop-play-header-clock desktop-play-header-clock--white"
            aria-label="White player clock"
          >
            <span class="desktop-play-color-tag desktop-play-color-tag--white" aria-hidden="true">White</span>
            <span id="desktopPlayWhiteName" class="desktop-play-header-player">White</span>
            <span id="whiteClockTimeText" class="desktop-play-header-time">00:00:00</span>
          </div>
        </div>

        <div id="desktopPlayHeaderRun" class="desktop-play-header-run desktop-play-header-run--hidden" aria-label="Start game from loaded position" aria-hidden="true">
          <div id="desktopPlayGameRun"></div>
        </div>
      </header>

      <div class="desktop-play-content">
        <aside
          id="desktopPlaySidebarMoves"
          class="desktop-play-sidebar desktop-play-sidebar--left desktop-play-sidebar--collapsed"
          aria-label="Moves"
        >
          <button
            type="button"
            class="desktop-play-sidebar-tab desktop-play-sidebar-tab--expand"
            aria-label="Expand moves panel"
            title="Expand moves"
          >+</button>
          <div class="desktop-play-sidebar-stacks">
            <section class="desktop-play-dock desktop-play-moves">
            <div class="desktop-play-dock-title">
              <span class="desktop-play-dock-title-text">Moves</span>
              <span class="desktop-play-dock-title-actions">
                <button
                  type="button"
                  class="desktop-play-dock-toggle desktop-play-dock-toggle--collapse desktop-play-dock-toggle--collapse-moves"
                  aria-label="Collapse moves panel"
                  title="Collapse"
                >−</button>
              </span>
            </div>
            <div class="desktop-play-moves-body">
              <div id="movesDiv" class="movesDiv desktop-play-panel-list desktop-play-moves-list"></div>
              <div
                id="desktopPlayReviewNav"
                class="desktop-play-review-nav"
                hidden
                aria-label="Review navigation"
              ></div>
            </div>
            </section>
            <section
              id="desktopPlaySetupDock"
              class="desktop-play-dock desktop-play-setup"
              aria-label="Position setup"
            >
              <div class="desktop-play-dock-title">
                <span class="desktop-play-dock-title-text">Pieces</span>
                <span class="desktop-play-dock-title-actions">
                  <button
                    type="button"
                    class="desktop-play-dock-toggle desktop-play-dock-toggle--collapse desktop-play-dock-toggle--collapse-setup"
                    aria-label="Collapse pieces panel"
                    title="Collapse"
                  >−</button>
                </span>
              </div>
              <div id="desktopPlaySetupPanel" class="desktop-play-setup-panel"></div>
            </section>
            <section
              id="desktopPlayConfigDock"
              class="desktop-play-dock desktop-play-config"
              aria-label="Brain configuration"
            >
              <div class="desktop-play-dock-title">
                <span class="desktop-play-dock-title-text">Configuration</span>
                <span class="desktop-play-dock-title-actions">
                  <button
                    type="button"
                    class="desktop-play-dock-toggle desktop-play-dock-toggle--collapse desktop-play-dock-toggle--collapse-config"
                    aria-label="Collapse configuration panel"
                    title="Collapse"
                  >−</button>
                </span>
              </div>
              <div id="desktopPlayConfigPanel" class="desktop-play-config-panel-host"></div>
            </section>
          </div>
        </aside>

        <main class="desktop-play-main">
          <div class="desktop-play-board-area">
            <div id="chessboard" class="desktop-play-board"></div>
          </div>
        </main>

        <aside
          id="desktopPlaySidebarGames"
          class="desktop-play-sidebar desktop-play-sidebar--right desktop-play-sidebar--collapsed"
          aria-label="Games"
        >
          <button
            type="button"
            class="desktop-play-sidebar-tab desktop-play-sidebar-tab--expand"
            aria-label="Expand games panel"
            title="Expand games"
          >+</button>
          <section class="desktop-play-dock desktop-play-games">
            <div class="desktop-play-dock-title">
              <div class="desktop-play-saved-list-filters" role="tablist" aria-label="Saved list filter">
                <button
                  type="button"
                  class="desktop-play-saved-list-filter is-active"
                  data-filter="games"
                  role="tab"
                  aria-selected="true"
                >Games</button>
                <span class="desktop-play-saved-list-filter-sep" aria-hidden="true">|</span>
                <button
                  type="button"
                  class="desktop-play-saved-list-filter"
                  data-filter="positions"
                  role="tab"
                  aria-selected="false"
                >Positions</button>
              </div>
              <span class="desktop-play-dock-title-actions">
                <button
                  type="button"
                  class="desktop-play-dock-toggle desktop-play-dock-toggle--collapse"
                  aria-label="Collapse games panel"
                  title="Collapse"
                >−</button>
              </span>
            </div>
            <div id="gamesDiv" class="desktop-play-panel-list desktop-play-games-list"></div>
          </section>
        </aside>
      </div>

      <footer class="desktop-play-footer" id="desktopPlayFooter" aria-label="Game status">
        <p id="desktopPlayStatusBar" class="desktop-play-status-bar" aria-live="polite"></p>
        <div class="desktop-play-footer-captured" aria-label="Captured pieces">
          <div id="blackCapturedPiece" class="desktop-play-captured-row"></div>
          <div id="whiteCapturedPiece" class="desktop-play-captured-row"></div>
        </div>
      </footer>
    </div>
  </div>
</body>
</html>
