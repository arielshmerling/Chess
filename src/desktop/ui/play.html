<body class="desktop-shell desktop-play-page desktop-has-topbar">
  <div class="desktop-play-shell">
    <nav id="desktopPlayActions" class="desktop-play-actions" data-i18n="play.shell.gameActions" data-i18n-attr="aria-label"></nav>

    <div class="desktop-play-workspace">
      <header class="desktop-play-header" id="desktopPlayHeader" data-i18n="play.shell.playersAndClocks" data-i18n-attr="aria-label">
        <p id="desktopPlayMatchTitle" class="desktop-play-header-match" data-i18n="play.sessionMode.play">Play Mode</p>

        <div class="desktop-play-header-center" dir="ltr">
          <div
            id="desktopPlayHeaderWhite"
            class="desktop-play-header-clock desktop-play-header-clock--white"
            data-i18n="play.shell.whitePlayerClock"
            data-i18n-attr="aria-label"
          >
            <span class="desktop-play-color-tag desktop-play-color-tag--white" aria-hidden="true" data-i18n="common.white">White</span>
            <span id="desktopPlayWhiteName" class="desktop-play-header-player" data-i18n="common.white">White</span>
            <span id="whiteClockTimeText" class="desktop-play-header-time">00:00:00</span>
          </div>

          <div
            id="desktopPlayHeaderBlack"
            class="desktop-play-header-clock desktop-play-header-clock--black"
            data-i18n="play.shell.blackPlayerClock"
            data-i18n-attr="aria-label"
          >
            <span class="desktop-play-color-tag desktop-play-color-tag--black" aria-hidden="true" data-i18n="common.black">Black</span>
            <span id="desktopPlayBlackName" class="desktop-play-header-player" data-i18n="common.black">Black</span>
            <span id="blackClockTimeText" class="desktop-play-header-time">00:00:00</span>
          </div>
        </div>

        <div id="desktopPlayHeaderRun" class="desktop-play-header-run desktop-play-header-run--hidden" data-i18n="play.shell.startFromLoadedPosition" data-i18n-attr="aria-label" aria-hidden="true">
          <div id="desktopPlayGameRun"></div>
        </div>
      </header>

      <div class="desktop-play-content">
        <aside
          id="desktopPlaySidebarMoves"
          class="desktop-play-sidebar desktop-play-sidebar--left desktop-play-sidebar--collapsed"
          aria-label="Moves"
          data-i18n="play.shell.moves"
          data-i18n-attr="aria-label"
        >
          <button
            type="button"
            class="desktop-play-sidebar-tab desktop-play-sidebar-tab--expand"
            data-i18n="play.shell.expandMovesPanel"
            data-i18n-attr="aria-label title"
          >+</button>
          <div class="desktop-play-sidebar-stacks">
            <section class="desktop-play-dock desktop-play-moves">
            <div class="desktop-play-dock-title">
              <span class="desktop-play-dock-title-text" data-i18n="play.shell.moves">Moves</span>
              <span class="desktop-play-dock-title-actions">
                <button
                  type="button"
                  class="desktop-play-dock-toggle desktop-play-dock-toggle--collapse desktop-play-dock-toggle--collapse-moves"
                  data-i18n="play.shell.collapseMovesPanel"
                  data-i18n-attr="aria-label"
                  data-i18n-title="common.collapse"
                >−</button>
              </span>
            </div>
            <div class="desktop-play-moves-body">
              <div id="movesDiv" class="movesDiv desktop-play-panel-list desktop-play-moves-list"></div>
              <div
                id="desktopPlayReviewNav"
                class="desktop-play-review-nav"
                hidden
                data-i18n="play.shell.reviewNavigation"
                data-i18n-attr="aria-label"
              ></div>
            </div>
            </section>
            <section
              id="desktopPlaySetupDock"
              class="desktop-play-dock desktop-play-setup"
              data-i18n="play.shell.positionSetup"
              data-i18n-attr="aria-label"
            >
              <div class="desktop-play-dock-title">
                <span class="desktop-play-dock-title-text" data-i18n="play.shell.pieces">Pieces</span>
                <span class="desktop-play-dock-title-actions">
                  <button
                    type="button"
                    class="desktop-play-dock-toggle desktop-play-dock-toggle--collapse desktop-play-dock-toggle--collapse-setup"
                    data-i18n="play.shell.collapsePiecesPanel"
                    data-i18n-attr="aria-label"
                    data-i18n-title="common.collapse"
                  >−</button>
                </span>
              </div>
              <div id="desktopPlaySetupPanel" class="desktop-play-setup-panel"></div>
            </section>
            <section
              id="desktopPlayConfigDock"
              class="desktop-play-dock desktop-play-config"
              data-i18n="play.shell.brainConfiguration"
              data-i18n-attr="aria-label"
            >
              <div class="desktop-play-dock-title">
                <span class="desktop-play-dock-title-text" data-i18n="play.shell.configuration">Configuration</span>
                <span class="desktop-play-dock-title-actions">
                  <button
                    type="button"
                    class="desktop-play-dock-toggle desktop-play-dock-toggle--collapse desktop-play-dock-toggle--collapse-config"
                    data-i18n="play.shell.collapseConfigurationPanel"
                    data-i18n-attr="aria-label"
                    data-i18n-title="common.collapse"
                  >−</button>
                </span>
              </div>
              <div id="desktopPlayConfigPanel" class="desktop-play-config-panel-host"></div>
            </section>
          </div>
        </aside>

        <main class="desktop-play-main">
          <div class="desktop-play-board-area">
            <div id="chessboard" class="desktop-play-board" dir="ltr"></div>
          </div>
        </main>

        <aside
          id="desktopPlaySidebarGames"
          class="desktop-play-sidebar desktop-play-sidebar--right desktop-play-sidebar--collapsed"
          data-i18n="play.shell.games"
          data-i18n-attr="aria-label"
        >
          <button
            type="button"
            class="desktop-play-sidebar-tab desktop-play-sidebar-tab--expand"
            data-i18n="play.shell.expandGamesPanel"
            data-i18n-attr="aria-label"
            data-i18n-title="play.shell.expandGames"
          >+</button>
          <section class="desktop-play-dock desktop-play-games">
            <div class="desktop-play-dock-title">
              <div class="desktop-play-saved-list-filters" role="tablist" data-i18n="play.shell.savedListFilter" data-i18n-attr="aria-label">
                <button
                  type="button"
                  class="desktop-play-saved-list-filter is-active"
                  data-filter="games"
                  role="tab"
                  aria-selected="true"
                  data-i18n="play.shell.games"
                >Games</button>
                <span class="desktop-play-saved-list-filter-sep" aria-hidden="true">|</span>
                <button
                  type="button"
                  class="desktop-play-saved-list-filter"
                  data-filter="positions"
                  role="tab"
                  aria-selected="false"
                  data-i18n="play.shell.positions"
                >Positions</button>
              </div>
              <span class="desktop-play-dock-title-actions">
                <button
                  type="button"
                  class="desktop-play-dock-toggle desktop-play-dock-toggle--collapse"
                  data-i18n="play.shell.collapseGamesPanel"
                  data-i18n-attr="aria-label"
                  data-i18n-title="common.collapse"
                >−</button>
              </span>
            </div>
            <div id="gamesDiv" class="desktop-play-panel-list desktop-play-games-list"></div>
          </section>
        </aside>
      </div>

      <footer class="desktop-play-footer" id="desktopPlayFooter" data-i18n="play.shell.gameStatus" data-i18n-attr="aria-label">
        <p id="desktopPlayStatusBar" class="desktop-play-status-bar" aria-live="polite"></p>
        <div class="desktop-play-footer-captured" data-i18n="play.shell.capturedPieces" data-i18n-attr="aria-label">
          <div id="blackCapturedPiece" class="desktop-play-captured-row"></div>
          <div id="whiteCapturedPiece" class="desktop-play-captured-row"></div>
        </div>
      </footer>
    </div>
  </div>
</body>
</html>
