<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/app/strings/en.js"></script>
  <script src="/app/strings/en-extra.js"></script>
  <script src="/app/strings/he.js"></script>
  <script src="/app/strings/he-extra.js"></script>
  <script src="/app/strings/index.js"></script>
  <title>שגיאה — שחמט שמרלינג</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/app/ui/app.css">
</head>
<body class="desktop-shell">
  <main class="desktop-error-panel">
    <h1>Something went wrong</h1>
    <p class="desktop-error-message" id="desktopErrorMessage">An error occurred.</p>
    <p class="desktop-error-code" id="desktopErrorCode"></p>
    <a class="desktop-btn desktop-btn-primary" href="/app/play">Back to main</a>
  </main>
  <script src="/app/ui/desktop-error.js"></script>
<script>
(function () {
  var t = window.ShmerlingStrings && window.ShmerlingStrings.t;
  if (!t) return;
  document.title = t("desktop.error.title");
  var h = document.querySelector("h1");
  if (h) h.textContent = t("desktop.error.title");
  var msg = document.getElementById("desktopErrorMessage");
  if (msg && !msg.textContent.trim()) msg.textContent = t("desktop.error.body");
  else if (msg && msg.textContent === "An error occurred.") msg.textContent = t("desktop.error.body");
  var a = document.querySelector("a");
  if (a) a.textContent = t("desktop.error.back");
})();
</script></body>
</html>
